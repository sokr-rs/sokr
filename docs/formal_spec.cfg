\* TLC configuration for the SOKR version-handshake spec.
\* Core version is fixed at 0.3 (major=0, minor=3) to match SokrVersion::CURRENT.
\* Plugin version ranges are deliberately wide enough to exercise every
\* rejection path: major != core (1), and minor > core minor (4).

CONSTANTS
    NULL = NULL
    p1 = p1
    p2 = p2
    p3 = p3
    PluginIds = {p1, p2, p3}
    Majors = {0, 1}
    Minors = {0, 1, 2, 3, 4}
    MaxSubstrates = 3
    CoreMajor = 0
    CoreMinor = 3

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT VersionCompatibilityInvariant
INVARIANT RegistryConsistencyInvariant
INVARIANT NoDuplicateInvariant
INVARIANT CapacityInvariant
INVARIANT CompatibilityDecisionInvariant
