[package]
name = "sokr"
version = "0.2.0"
authors = ["The SOKR Project"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sokr-rs/sokr"
homepage = "https://github.com/sokr-rs/sokr"
documentation = "https://docs.rs/sokr"
keywords = ["compute", "runtime", "kernel", "gpu", "agnostic"]
categories = ["hardware-support", "no-std"]
rust-version = "1.78"
description = "SOKR core — immutable C ABI surface for substrate plugins"
readme = "README.md"

[lib]
name = "sokr"
crate-type = ["rlib"]

[features]
default = []
ffi = []

[dependencies]

[dev-dependencies]
sokr-cpu = { path = "../sokr-plugins/crates/sokr-cpu" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.test]
panic = "unwind"
