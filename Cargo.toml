[workspace]
members = [
    "crates/sokr-core",
    "crates/sokr-cpu",
    "crates/sokr-dispatch-first",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
authors = ["The SOKR Project"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sokr-rs/sokr"
homepage = "https://github.com/sokr-rs/sokr"
documentation = "https://docs.rs/sokr"
keywords = ["compute", "runtime", "kernel", "gpu", "agnostic"]
categories = ["hardware-support", "no-std"]
rust-version = "1.78"

[workspace.dependencies]
# Core has no dependencies - keep it pure
# Substrate plugins will add their hardware-specific deps here

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
panic = "abort"
