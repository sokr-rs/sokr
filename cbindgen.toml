# cbindgen configuration for SOKR C header generation
# Run: cbindgen --crate sokr --output include/sokr.h

language = "C"
pragma_once = true
cpp_compat = true

[parse]
parse_deps = false

[export]
include = [
    "SokrVersion",
    "SokrResult",
    "SokrComputationId",
    "SokrCapabilityQuery",
    "SokrCapabilityResponse",
    "SokrDispatchRequest",
    "SokrDispatchResponse",
    "SokrCompletionToken",
    "SokrCompletionQuery",
    "SokrCompletionSignal",
    "SokrSubstratePlugin",
    "SokrCapabilityFn",
    "SokrDispatchFn",
    "SokrCompletionFn",
    "SokrDestroyFn",
    "SOKR_VERSION_CURRENT",
]

[fn]
prefix = ""
postfix = ""

[struct]
rename_fields = "SnakeCase"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[defines]
"feature = ffi" = "SOKR_FFI_ENABLED"
