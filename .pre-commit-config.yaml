repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      - id: header-drift-check
        name: Header Drift Check
        entry: bash -c "cbindgen --crate sokr --output /tmp/sokr.h.new && diff -q include/sokr.h /tmp/sokr.h.new > /dev/null || (echo 'sokr.h is out of date' && exit 1)"
        language: system
        files: ^src/.*\.rs$|^cbindgen\.toml$
        pass_filenames: false

# TODO: re-add cargo-test hook in Phase 1 once sokr-cpu integration test exists
